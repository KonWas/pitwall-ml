[project]
name = "pitwall-ml"
version = "0.1.0"
description = "F1 Telemetry & Strategy ML Engine"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2",
    "fastf1>=3.8",
    "gymnasium>=1.0",
    "mapie>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "stable-baselines3>=2.4",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pybind11>=2.13"]
notebooks = ["ipykernel>=6", "matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: test downloads data from the F1 live timing API (deselect with -m 'not network')",
]
